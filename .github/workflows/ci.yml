name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    name: lint, format, pytest, pot-extract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GI stack (PyGObject build/runtime deps) for GSettings tests
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository-2.0-dev \
            gir1.2-glib-2.0 \
            libglib2.0-bin \
            pkg-config \
            gcc \
            python3-dev
          pip install PyGObject

      - name: Verify GI stack is actually usable (anti-silent-skip gate)
        run: |
          # CORE-3's tests/conftest.py intentionally SKIPS (not fails) the
          # GSettings test module when PyGObject or glib-compile-schemas are
          # missing, since that is a legitimate state on a contributor's own
          # machine. In CI we control the image, so that condition must never
          # happen silently: this step fails the whole job loudly, before
          # pytest even runs, if either prerequisite is not actually usable -
          # so a missing GI stack can never show up downstream as "0 tests ran,
          # job green".
          python3 -c "import gi; gi.require_version('GLib', '2.0'); from gi.repository import GLib; print('gi import OK:', gi.__version__)"
          glib-compile-schemas --version

      - name: Install project (editable) with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: pytest
        run: pytest -q

      - name: Install gettext (for xgettext)
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Extract translatable strings (D26)
        run: |
          mkdir -p po
          find slideshow_lock -name '*.py' -print0 \
            | xargs -0 xgettext --language=Python --from-code=UTF-8 --keyword=_ \
                --package-name=slideshow-lock -o po/messages.pot
          if [ ! -s po/messages.pot ]; then
            echo "::error::po/messages.pot was not created (xgettext found zero strings) - check _() wrapping" >&2
            exit 1
          fi
          msgid_count=$(grep -c '^msgid "' po/messages.pot)
          echo "msgid entries (including the empty header): ${msgid_count}"
          if [ "${msgid_count}" -le 1 ]; then
            echo "::error::po/messages.pot has no translatable strings beyond the header - strings are not wrapped in _()" >&2
            exit 1
          fi
