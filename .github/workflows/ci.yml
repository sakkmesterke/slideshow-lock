name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job only reads the repository: no write scope for the token.
permissions:
  contents: read

jobs:
  lint-test:
    name: lint, format, pytest, pot-extract
    runs-on: ubuntu-latest
    # Longest observed run is ~140 s; 15 min leaves >6x headroom while still
    # cutting a hung test off far below GitHub's 360 min default.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GI stack (PyGObject build/runtime deps) for GSettings tests
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository-2.0-dev \
            gir1.2-glib-2.0 \
            libglib2.0-bin \
            libcairo2-dev \
            pkg-config \
            gcc \
            python3-dev \
            gir1.2-gdkpixbuf-2.0 \
            gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base \
            gir1.2-gtk-4.0 \
            dbus-daemon \
            gettext
          pip install PyGObject

      - name: Verify GI stack is actually usable (anti-silent-skip gate)
        run: |
          # CORE-3's tests/conftest.py intentionally SKIPS (not fails) the
          # GSettings test module when PyGObject or glib-compile-schemas are
          # missing, since that is a legitimate state on a contributor's own
          # machine. In CI we control the image, so that condition must never
          # happen silently: this step fails the whole job loudly, before
          # pytest even runs, if either prerequisite is not actually usable -
          # so a missing GI stack can never show up downstream as "0 tests ran,
          # job green".
          python3 -c "import gi; gi.require_version('GLib', '2.0'); from gi.repository import GLib; print('gi import OK:', gi.__version__)"
          glib-compile-schemas --version
          # CORE-2: the scaling tests decode with GdkPixbuf and scale with GStreamer's
          # videoscale. Without these typelibs tests/test_scaling_gdk.py skips its whole
          # module, so a missing package must fail here, loudly, instead.
          python3 -c "import gi; gi.require_version('GdkPixbuf', '2.0'); from gi.repository import GdkPixbuf; print('GdkPixbuf OK:', GdkPixbuf.PIXBUF_VERSION)"
          python3 -c "import gi; gi.require_version('Gst', '1.0'); from gi.repository import Gst; Gst.init(None); assert Gst.ElementFactory.find('videoscale'), 'videoscale element missing'; print('GStreamer OK:', Gst.version_string())"
          # CORE-2: tests/test_preview_app.py imports slideshow_lock.preview_app, which needs the
          # GTK 4 typelibs (no display is opened). Without them the module fails at import, or
          # would be skipped by an importorskip and caught only by the no-skip gate: a missing
          # package is named here, up front, instead.
          python3 -c "import gi; gi.require_version('Gtk', '4.0'); gi.require_version('Gdk', '4.0'); gi.require_version('Graphene', '1.0'); from gi.repository import Gtk, Gdk, Graphene; print('GTK OK:', Gtk.get_major_version(), Gtk.get_minor_version())"
          python3 -c "import slideshow_lock.preview_app, slideshow_lock.preview_window; print('preview modules import OK')"
          # CORE-1: tests/test_dbus_adapters.py and tests/test_service_dbus.py start private
          # dbus-daemon processes (a fake desktop). Locally they skip without the daemon; in CI a
          # missing daemon must be named here, up front.
          dbus-daemon --version | head -1
          # Translations: tests/test_i18n_tools.py and the run.sh tests run msgfmt, xgettext and
          # msgmerge (package gettext). Locally they skip without it; in CI a missing tool must be
          # named here, up front, not found by the no-skip gate after pytest.
          msgfmt --version | head -1
          xgettext --version | head -1
          msgmerge --version | head -1
          python3 -c "import slideshow_lock.service; print('service module imports OK')"

      - name: Install project (editable) with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: pytest
        run: pytest -q -rs --junitxml=pytest-junit.xml

      - name: No-skip gate (any skipped test fails the job)
        run: |
          # pytest exits 0 when tests are skipped. In CI every test must run:
          # a skip (missing tool, wrong user, unexpected container) is a silent
          # loss of coverage, so it is treated as a failure here.
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse("pytest-junit.xml").getroot().findall(".//testcase")
          skipped = [c for c in cases if c.find("skipped") is not None]
          print(f"tests in report: {len(cases)}, skipped: {len(skipped)}")
          for c in skipped:
              print(f"::error::skipped: {c.get('classname')}.{c.get('name')}: {c.find('skipped').get('message')}")
          if not cases or skipped:
              sys.exit(1)
          PY

      - name: Translations (D26) - catalogs, template, strings
        # po/LINGUAS and the po/*.po agree, every catalog passes msgfmt -c --check-format, and the
        # template xgettext makes holds exactly the strings that the source passes to _() (each
        # one a plain literal, none evaluated at import): the count is compared, not "at least 1".
        run: bash tools/i18n.sh check
