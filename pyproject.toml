[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slideshow-lock"
version = "1.0.3"
description = "GNOME/Wayland idle slideshow screensaver with session-lock integration"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "TrenSoft" }]
dependencies = ["PyGObject>=3.42"]

[project.urls]
Homepage = "https://github.com/sakkmesterke/slideshow-lock"
Source = "https://github.com/sakkmesterke/slideshow-lock"
Issues = "https://github.com/sakkmesterke/slideshow-lock/issues"

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.setuptools.packages.find]
include = ["slideshow_lock*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spawns_processes: the test starts a program on purpose (the tripwire in conftest.py stands down)"]
