[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slideshow-lock"
version = "0.0.0"
description = "GNOME/Wayland idle slideshow screensaver with session-lock integration"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["PyGObject>=3.42"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.setuptools.packages.find]
include = ["slideshow_lock*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
